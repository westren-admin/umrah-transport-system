<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام النقل - لوحة التحكم المباشرة</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- خط Cairo -->
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <style> body { font-family: 'Cairo', sans-serif; } </style>
</head>
<body class="bg-gray-50 min-h-screen p-4 md:p-8">

  <div class="max-w-7xl mx-auto space-y-6">
    
    <!-- الترويسة الرئيسية -->
    <div class="flex flex-col md:flex-row justify-between items-center bg-white p-6 rounded-2xl shadow-sm border border-gray-100 gap-4">
      <div>
        <h1 class="text-2xl font-bold text-gray-800">📊 لوحة متابعة رحلات النقل</h1>
        <p class="text-gray-500 text-sm mt-1">متابعة فورية للمجموعات وتعيينات السائقين والحافلات</p>
      </div>
      <button id="logoutBtn" class="bg-red-50 hover:bg-red-100 text-red-600 px-4 py-2 rounded-lg text-sm font-semibold transition">
        تسجيل الخروج
      </button>
    </div>

    <!-- كروت الإحصائيات السريعة -->
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
      <div class="bg-white p-5 rounded-xl border border-gray-100 shadow-sm flex justify-between items-center">
        <div>
          <p class="text-gray-500 text-xs font-semibold">إجمالي المجموعات</p>

          <h3 id="statTotal" class="text-2xl font-bold text-gray-800 mt-1">0</h3>
        </div>
        <div class="bg-blue-50 text-blue-600 p-3 rounded-lg text-xl">📋</div>
      </div>
      
      <div class="bg-white p-5 rounded-xl border border-gray-100 shadow-sm flex justify-between items-center">
        <div>
          <p class="text-gray-500 text-xs font-semibold">بانتظار النقل</p>
          <h3 id="statPending" class="text-2xl font-bold text-yellow-600 mt-1">0</h3>
        </div>
        <div class="bg-yellow-50 text-yellow-600 p-3 rounded-lg text-xl">⏳</div>
      </div>

      <div class="bg-white p-5 rounded-xl border border-gray-100 shadow-sm flex justify-between items-center">
        <div>
          <p class="text-gray-500 text-xs font-semibold">تم تعيين النقل</p>
          <h3 id="statAssigned" class="text-2xl font-bold text-emerald-600 mt-1">0</h3>
        </div>
        <div class="bg-emerald-50 text-emerald-600 p-3 rounded-lg text-xl">✅</div>
      </div>
    </div>

    <!-- جدول عرض المجموعات -->
    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-right border-collapse">
          <thead>
            <tr class="bg-gray-100 text-gray-700 text-xs font-bold uppercase tracking-wider">
              <th class="py-3.5 px-4">رقم المجموعة</th>
              <th class="py-3.5 px-4">العدد</th>
              <th class="py-3.5 px-4">تاريخ/وقت الوصول</th>
              <th class="py-3.5 px-4">الفنادق (مكة / المدينة)</th>
              <th class="py-3.5 px-4">شركة النقل</th>
              <th class="py-3.5 px-4">الحالة</th>
              <th class="py-3.5 px-4">تفاصيل السائق والحافلة</th>
            </tr>
          </thead>
          <tbody id="groupsTableBody" class="divide-y divide-gray-100 text-sm">
            <tr>
              <td colspan="7" class="text-center py-8 text-gray-400">جاري تحميل البيانات...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <!-- السكربت الخاص بالصفحة -->
  <script type="module">
    import { supabase } from './assets/js/supabase.js';

    const tableBody = document.getElementById('groupsTableBody');

    async function loadDashboardData() {
      try {
        // جلب المجموعات مع التفاصيل المرتبطة بها
        const { data: groups, error } = await supabase
          .from('groups')
          .select(`
            *,
            transport_assignments ( driver_name, bus_number, driver_phone ),
            profiles:transport_company_id ( company_name )
          `)
          .order('created_at', { ascending: false });

        if (error) throw error;

        updateStats(groups);

        if (!groups || groups.length === 0) {
          tableBody.innerHTML = `<tr><td colspan="7" class="text-center py-8 text-gray-400">لا توجد مجموعات مسجلة حالياً</td></tr>`;
          return;
        }

        tableBody.innerHTML = groups.map(g => {
          const assignment = g.transport_assignments?.[0] || g.transport_assignments;
          const isAssigned = g.status === 'تم تعيين النقل';
          const statusBadge = isAssigned 
            ? `<span class="bg-emerald-100 text-emerald-800 text-xs font-semibold px-2.5 py-1 rounded-full">تم التعيين</span>`
            : `<span class="bg-yellow-100 text-yellow-800 text-xs font-semibold px-2.5 py-1 rounded-full">بانتظار النقل</span>`;

          const driverInfo = assignment ? `
            <div class="text-xs space-y-0.5">
              <p class="font-bold text-gray-800">👤 ${assignment.driver_name}</p>
              <p class="text-gray-500">🚌 حافلة: ${assignment.bus_number}</p>
              <p class="text-blue-600">📱 ${assignment.driver_phone}</p>
            </div>
          ` : `<span class="text-gray-400 text-xs">غير محدد</span>`;

          return `
            <tr class="hover:bg-gray-50 transition">
              <td class="py-3.5 px-4 font-bold text-gray-800">${g.group_number}</td>
              <td class="py-3.5 px-4 font-semibold text-emerald-600">${g.num_pilgrims} معتمر</td>
              <td class="py-3.5 px-4 text-xs">
                <div>📅 ${g.arrival_date}</div>
                <div class="text-gray-400">⏰ ${g.flight_time}</div>
              </td>
              <td class="py-3.5 px-4 text-xs">
                <div>🕋 ${g.makkah_hotel || '-'}</div>
                <div>🕌 ${g.madinah_hotel || '-'}</div>
              </td>
              <td class="py-3.5 px-4 font-semibold text-gray-700">${g.profiles?.company_name || 'غير محدد'}</td>
              <td class="py-3.5 px-4">${statusBadge}</td>
              <td class="py-3.5 px-4">${driverInfo}</td>
            </tr>
          `;
        }).join('');

      } catch (err) {
        tableBody.innerHTML = `<tr><td colspan="7" class="text-center py-8 text-red-500">خطأ في جلب البيانات: ${err.message}</td></tr>`;
      }
    }

    function updateStats(groups) {
      document.getElementById('statTotal').innerText = groups.length;
      document.getElementById('statPending').innerText = groups.filter(g => g.status !== 'تم تعيين النقل').length;
      document.getElementById('statAssigned').innerText = groups.filter(g => g.status === 'تم تعيين النقل').length;
    }

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await supabase.auth.signOut();
      window.location.href = 'index.html';
    });

    loadDashboardData();
  </script>
</body>
</html>
