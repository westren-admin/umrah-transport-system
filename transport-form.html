<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام النقل - تعيين وعرض رحلات الشركة</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <style> body { font-family: 'Cairo', sans-serif; } </style>
</head>
<body class="bg-gray-100 min-h-screen p-4 md:p-8">

  <div class="max-w-4xl mx-auto space-y-6">
    <!-- الترويسة وزر الخروج -->
    <div class="flex justify-between items-center bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
      <div>
        <h2 class="text-xl font-bold text-gray-800">🚌 لوحة شركة النقل</h2>
        <p class="text-xs text-gray-500">تعيين السائقين والمجموعات الخاصة ببطاقتك</p>
      </div>
      <button id="logoutBtn" class="bg-red-50 hover:bg-red-100 text-red-600 px-4 py-2 rounded-lg text-sm font-semibold transition">
        تسجيل الخروج
      </button>
    </div>

    <!-- نموذج تعيين سائق -->
    <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
      <h3 class="text-base font-bold text-gray-800 mb-4">تعيين سائق وحافلة للمجموعة</h3>
      <div id="alertBox" class="hidden mb-4 p-3 rounded-lg text-xs text-center font-semibold"></div>

      <form id="transportForm" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1">اختر المجموعة *</label>
          <select id="group_id" required class="w-full px-3 py-2 text-sm rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 outline-none bg-white">
            <option value="">جاري تحميل المجموعات...</option>
          </select>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div>
            <label class="block text-xs font-semibold text-gray-700 mb-1">اسم السائق *</label>
            <input type="text" id="driver_name" required placeholder="محمد أحمد" class="w-full px-3 py-2 text-sm rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 outline-none">
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-700 mb-1">رقم الحافلة *</label>
            <input type="text" id="bus_number" required placeholder="أ ب ج 123" class="w-full px-3 py-2 text-sm rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 outline-none">
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-700 mb-1">جوال السائق *</label>
            <input type="tel" id="driver_phone" required placeholder="0501234567" class="w-full px-3 py-2 text-sm rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 outline-none">
          </div>
        </div>
        <button type="submit" id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-lg shadow transition">
          حفظ وتعيين النقل
        </button>
      </form>
    </div>

    <!-- جدول الرحلات المخصصة للشركة -->
    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
      <div class="p-4 border-b border-gray-100">
        <h3 class="font-bold text-gray-800 text-sm">🚚 كافة الرحلات الموجهة لشركتك</h3>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-right text-xs">
          <thead class="bg-gray-50 text-gray-600">
            <tr>
              <th class="p-3">رقم المجموعة</th>
              <th class="p-3">العدد</th>
              <th class="p-3">تاريخ الوصول</th>
              <th class="p-3">الفنادق</th>
              <th class="p-3">السائق الحافلة</th>
              <th class="p-3">الحالة</th>
            </tr>
          </thead>
          <tbody id="assignedTableBody" class="divide-y divide-gray-100">
            <tr><td colspan="6" class="text-center py-4 text-gray-400">جاري التحميل...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script type="module">
    import { supabase } from './assets/js/supabase.js';

    const alertBox = document.getElementById('alertBox');
    const groupSelect = document.getElementById('group_id');
    let currentUser = null;

    async function init() {
      const { data: { user } } = await supabase.auth.getUser();
      if (!user) { window.location.href = 'index.html'; return; }
      currentUser = user;
      loadData();
    }

    async function loadData() {
      const { data: groups } = await supabase
        .from('groups')
        .select('*, transport_assignments(*)')
        .eq('transport_company_id', currentUser.id)
        .order('created_at', { ascending: false });

      const tbody = document.getElementById('assignedTableBody');
      groupSelect.innerHTML = '<option value="">-- اختر مجموعة --</option>';

      if (!groups || groups.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="text-center py-4 text-gray-400">لا توجد مجموعات موجهة لشركتك حالياً</td></tr>`;
        return;
      }

      tbody.innerHTML = '';
      groups.forEach(g => {
        const assign = g.transport_assignments?.[0] || g.transport_assignments;
        
        // تعبئة الخيارات القابلة للتعيين
        const opt = document.createElement('option');
        opt.value = g.id;
        opt.textContent = `مجموعة ${g.group_number} (${g.num_pilgrims} معتمر) - ${g.arrival_date}`;
        groupSelect.appendChild(opt);

        // تعبئة الجدول
        const statusBadge = g.status === 'تم تعيين النقل' 
          ? `<span class="bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded-full">مكتمل</span>`
          : `<span class="bg-yellow-100 text-yellow-800 px-2 py-0.5 rounded-full">معلق</span>`;

        const driverInfo = assign ? `👤 ${assign.driver_name} (${assign.bus_number})` : '<span class="text-gray-400">لم يحدد</span>';

        tbody.innerHTML += `
          <tr class="hover:bg-gray-50">
            <td class="p-3 font-bold">${g.group_number}</td>
            <td class="p-3">${g.num_pilgrims}</td>
            <td class="p-3">${g.arrival_date}</td>
            <td class="p-3">🕋 ${g.makkah_hotel || '-'} | 🕌 ${g.madinah_hotel || '-'}</td>
            <td class="p-3 font-semibold text-blue-600">${driverInfo}</td>
            <td class="p-3">${statusBadge}</td>
          </tr>
        `;
      });
    }

    document.getElementById('transportForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const groupId = groupSelect.value;
      const driverName = document.getElementById('driver_name').value;
      const busNumber = document.getElementById('bus_number').value;
      const driverPhone = document.getElementById('driver_phone').value;

      try {
        await supabase.from('transport_assignments').upsert([{
          group_id: groupId,
          driver_name: driverName,
          bus_number: busNumber,
          driver_phone: driverPhone
        }], { onConflict: 'group_id' });

        await supabase.from('groups').update({ status: 'تم تعيين النقل' }).eq('id', groupId);

        showAlert('تم تحديث وتعيين السائق بنجاح! 🎉', 'bg-emerald-100 text-emerald-800');
        document.getElementById('transportForm').reset();
        loadData();
      } catch (err) {
        showAlert('خطأ: ' + err.message, 'bg-red-100 text-red-700');
      }
    });

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await supabase.auth.signOut();
      window.location.href = 'index.html';
    });

    function showAlert(msg, classes) {
      alertBox.className = `mb-4 p-3 rounded-lg text-xs text-center font-semibold ${classes}`;
      alertBox.textContent = msg;
      alertBox.classList.remove('hidden');
    }

    init();
  </script>
</body>
</html>
