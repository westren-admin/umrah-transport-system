<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام النقل - تعيين السائق والحافلة</title>
  <!-- مكتبة Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- الخطوط -->
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Cairo', sans-serif; }
  </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

  <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-xl border border-gray-100">
    <!-- الترويسة -->
    <div class="text-center mb-8">
      <div class="bg-blue-100 text-blue-700 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-3 text-2xl font-bold">
        🚌
      </div>
      <h2 class="text-2xl font-bold text-gray-800">تعيين السائق والحافلة</h2>
      <p class="text-gray-500 text-sm mt-1">اختر المجموعة وأدخل بيانات السائق والحافلة المخصصة</p>
    </div>

    <!-- تنبيهات النظام -->
    <div id="alertBox" class="hidden mb-6 p-4 rounded-xl text-sm text-center font-semibold"></div>

    <!-- النموذج -->
    <form id="transportForm" class="space-y-5">
      <!-- اختيار المجموعة -->
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1">اختر المجموعة *</label>
        <select id="group_id" required 
                class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition bg-white">
          <option value="">جاري تحميل المجموعات الموجهة لشركتك...</option>
        </select>
      </div>

      <!-- اسم السائق -->
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1">اسم السائق *</label>
        <input type="text" id="driver_name" required placeholder="مثال: محمد أحمد" 
               class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
      </div>

      <!-- رقم الحافلة -->
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1">رقم الحافلة / اللوحة *</label>
        <input type="text" id="bus_number" required placeholder="مثال: أ ب ج 1234" 
               class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
      </div>

      <!-- رقم جوال السائق -->
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1">رقم جوال السائق *</label>
        <input type="tel" id="driver_phone" required placeholder="مثال: 0501234567" 
               class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
      </div>

      <!-- زر الإرسال -->
      <button type="submit" id="submitBtn" 
              class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg shadow-md transition duration-200 flex items-center justify-center gap-2">
        <span>تأكيد وتعيين النقل</span>
      </button>
    </form>
  </div>

  <!-- السكربت الخاص بالصفحة -->
  <script type="module">
    import { supabase } from './assets/js/supabase.js';

    const alertBox = document.getElementById('alertBox');
    const groupSelect = document.getElementById('group_id');
    const transportForm = document.getElementById('transportForm');

    // 1. جلب المجموعات الخاصة بشركة النقل الحالية
    async function loadAssignedGroups() {
      const { data: { user } } = await supabase.auth.getUser();
      if (!user) {
        showAlert('يجب تسجيل الدخول لعرض المجموعات الخاصه بك', 'bg-yellow-100 text-yellow-800');
        return;
      }

      try {
        const { data, error } = await supabase
          .from('groups')
          .select('id, group_number, num_pilgrims, arrival_date')
          .eq('transport_company_id', user.id);

        if (error) throw error;

        groupSelect.innerHTML = '<option value="">-- اختر مجموعة --</option>';
        if (!data || data.length === 0) {
          groupSelect.innerHTML = '<option value="">لا توجد مجموعات موجهة لشركتك حالياً</option>';
          return;
        }

        data.forEach(group => {
          const option = document.createElement('option');
          option.value = group.id;
          option.textContent = `مجموعة ${group.group_number} (${group.num_pilgrims} معتمر) - وصول: ${group.arrival_date}`;
          groupSelect.appendChild(option);
        });
      } catch (err) {
        showAlert('خطأ أثناء جلب المجموعات: ' + err.message, 'bg-red-100 text-red-700');
      }
    }

    // 2. معالجة حفظ تعيين النقل
    transportForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.innerText = 'جاري الحفظ...';

      const groupId = groupSelect.value;
      const driverName = document.getElementById('driver_name').value;
      const busNumber = document.getElementById('bus_number').value;
      const driverPhone = document.getElementById('driver_phone').value;

      try {
        // إضافة التعيين بجدول transport_assignments
        const { error: assignError } = await supabase
          .from('transport_assignments')
          .upsert([
            {
              group_id: groupId,
              driver_name: driverName,
              bus_number: busNumber,
              driver_phone: driverPhone
            }
          ], { onConflict: 'group_id' });

        if (assignError) throw assignError;

        // تحديث حالة المجموعة إلى "تم تعيين النقل"
        const { error: updateError } = await supabase
          .from('groups')
          .update({ status: 'تم تعيين النقل' })
          .eq('id', groupId);

        if (updateError) throw updateError;

        showAlert('تم حفظ بيانات السائق والحافلة وتعديل حالة المجموعة بنجاح! 🎉', 'bg-emerald-100 text-emerald-800');
        transportForm.reset();
        loadAssignedGroups();
      } catch (err) {
        showAlert('حدث خطأ أثناء التحديث: ' + err.message, 'bg-red-100 text-red-700');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = 'تأكيد وتعيين النقل';
      }
    });

    function showAlert(msg, classes) {
      alertBox.className = `mb-6 p-4 rounded-xl text-sm text-center font-semibold ${classes}`;
      alertBox.textContent = msg;
      alertBox.classList.remove('hidden');
    }

    loadAssignedGroups();
  </script>
</body>
</html>
