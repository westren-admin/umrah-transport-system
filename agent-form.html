<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام العمرة والنقل - نموذج الوكيل الخارجي</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- خط Cairo -->
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <style> body { font-family: 'Cairo', sans-serif; } </style>
</head>
<body class="bg-gray-100 min-h-screen p-4 md:p-8">

  <div class="max-w-4xl mx-auto space-y-6">

    <!-- الترويسة ومعلومات الحساب -->
    <div class="flex justify-between items-center bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
      <div>
        <h2 class="text-xl font-bold text-gray-800">🕋 بوابة الوكيل الخارجي</h2>
        <p id="agentInfo" class="text-xs text-gray-500 mt-1">جاري التحقق من بيانات الحساب...</p>
      </div>
      <button id="logoutBtn" class="bg-red-50 hover:bg-red-100 text-red-600 px-4 py-2 rounded-lg text-sm font-semibold transition">
        تسجيل الخروج
      </button>
    </div>

    <!-- نموذج إضافة مجموعة جديدة -->
    <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 space-y-4">
      <h3 class="text-lg font-bold text-gray-800 border-b border-gray-100 pb-3">إضافة مجموعة جديدة</h3>

      <!-- صندوق التنبيهات والأخطاء -->
      <div id="alertBox" class="hidden p-3 rounded-lg text-xs font-semibold text-center"></div>

      <form id="groupForm" class="space-y-4">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1">رقم المجموعة *</label>
            <input type="text" id="groupNumber" required placeholder="مثال: 102"
                   class="w-full px-3 py-2.5 rounded-xl border border-gray-200 focus:outline-none focus:border-emerald-500 bg-blue-50/30 transition text-sm">
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1">عدد المعتمرين *</label>
            <input type="number" id="numPilgrims" required placeholder="مثال: 50" min="1"
                   class="w-full px-3 py-2.5 rounded-xl border border-gray-200 focus:outline-none focus:border-emerald-500 transition text-sm">
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1">تاريخ الوصول *</label>
            <input type="date" id="arrivalDate" required
                   class="w-full px-3 py-2.5 rounded-xl border border-gray-200 focus:outline-none focus:border-emerald-500 transition text-sm">
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1">وقت الرحلة *</label>
            <input type="time" id="flightTime" required
                   class="w-full px-3 py-2.5 rounded-xl border border-gray-200 focus:outline-none focus:border-emerald-500 transition text-sm">
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1">فندق مكة</label>
            <input type="text" id="makkahHotel" placeholder="مثال: فندق فلسطين"
                   class="w-full px-3 py-2.5 rounded-xl border border-gray-200 focus:outline-none focus:border-emerald-500 bg-blue-50/30 transition text-sm">
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1">فندق المدينة</label>
            <input type="text" id="madinahHotel" placeholder="مثال: فندق هيلتون"
                   class="w-full px-3 py-2.5 rounded-xl border border-gray-200 focus:outline-none focus:border-emerald-500 bg-blue-50/30 transition text-sm">
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1">شركة النقل الموجهة *</label>
          <select id="transportCompany" required class="w-full px-3 py-2.5 rounded-xl border border-gray-200 focus:outline-none focus:border-emerald-500 transition text-sm bg-white">
            <option value="">-- اختر شركة النقل --</option>
          </select>
        </div>

        <button type="submit" id="saveBtn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl shadow-sm transition mt-2">
          حفظ وإرسال الرحلة
        </button>
      </form>
    </div>

    <!-- جدول المجموعات المسجلة وحالة النقل -->
    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
      <div class="p-4 border-b border-gray-100 flex justify-between items-center">
        <h3 class="font-bold text-gray-800 text-sm">📋 مجموعاتي المسجلة وحالة النقل</h3>
        <button id="refreshBtn" class="text-xs text-emerald-600 font-semibold hover:underline">تحديث 🔄</button>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-right text-xs">
          <thead class="bg-gray-50 text-gray-600 border-b border-gray-100">
            <tr>
              <th class="p-3">رقم المجموعة</th>
              <th class="p-3">العدد</th>
              <th class="p-3">الوصول</th>
              <th class="p-3">الحالة</th>
              <th class="p-3">بيانات السائق والحافلة</th>
            </tr>
          </thead>
          <tbody id="myGroupsBody" class="divide-y divide-gray-100">
            <tr><td colspan="5" class="text-center py-4 text-gray-400">جاري تحميل الرحلات...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <!-- السكريبت البرمجي -->
  <script type="module">
    import { supabase } from './assets/js/supabase.js';

    let currentUser = null;

    // 1. التحقق من الدخول وجلب معلومات الحساب
    async function initPage() {
      const { data: { user } } = await supabase.auth.getUser();
      if (!user) {
        window.location.href = 'index.html';
        return;
      }
      currentUser = user;

      // جلب اسم الشركة للوكيل
      const { data: profile } = await supabase
        .from('profiles')
        .select('company_name')
        .eq('id', user.id)
        .single();

      document.getElementById('agentInfo').textContent = `الشركة: ${profile?.company_name || 'وكيل خارجي'}`;

      await loadTransportCompanies();
      await loadMyGroups();
    }

    // 2. تحميل شركات النقل المتاحة في القائمة المنسدلة
    async function loadTransportCompanies() {
      const select = document.getElementById('transportCompany');
      const { data: companies, error } = await supabase
        .from('profiles')
        .select('id, company_name')
        .eq('role', 'transport_company');

      if (error || !companies) return;

      select.innerHTML = '<option value="">-- اختر شركة النقل --</option>' +
        companies.map(c => `<option value="${c.id}">${c.company_name}</option>`).join('');
    }

    // 3. إضافة مجموعة جديدة
    document.getElementById('groupForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('saveBtn');
      btn.disabled = true;
      btn.innerText = 'جاري الحفظ والارسال...';

      const group_number = document.getElementById('groupNumber').value.trim();
      const num_pilgrims = parseInt(document.getElementById('numPilgrims').value);
      const arrival_date = document.getElementById('arrivalDate').value;
      const flight_time = document.getElementById('flightTime').value;
      const makkah_hotel = document.getElementById('makkahHotel').value.trim();
      const madinah_hotel = document.getElementById('madinahHotel').value.trim();
      const transport_company_id = document.getElementById('transportCompany').value;

      try {
        const { data, error } = await supabase
          .from('groups')
          .insert([
            {
              group_number,
              num_pilgrims,
              arrival_date,
              flight_time,
              // تزويد الحقول بجميع المسميات المحتملة لضمان التوافق مع القاعدة
              makkah_hotel: makkah_hotel,
              mecca_hotel: makkah_hotel,
              madinah_hotel: madinah_hotel,
              medina_hotel: madinah_hotel,
              transport_company_id,
              agent_company_id: currentUser.id,
              status: 'بانتظار النقل'
            }
          ]);

        if (error) throw error;

        showAlert('تم إضافة وإرسال المجموعة بنجاح!', 'bg-emerald-100 text-emerald-800');
        document.getElementById('groupForm').reset();
        await loadMyGroups();

      } catch (err) {
        console.error(err);
        showAlert('خطأ: ' + err.message, 'bg-red-100 text-red-700');
      } fontFinally: {
        btn.disabled = false;
        btn.innerText = 'حفظ وإرسال الرحلة';
      }
    });

    // 4. جلب وعرض مجموعات الوكيل المسجلة
    async function loadMyGroups() {
      const tbody = document.getElementById('myGroupsBody');

      const { data: groups, error } = await supabase
        .from('groups')
        .select(`
          *,
          transport_assignments (
            driver_name,
            bus_number,
            driver_phone
          )
        `)
        .eq('agent_company_id', currentUser.id)
        .order('created_at', { ascending: false });

      if (error) {
        tbody.innerHTML = `<tr><td colspan="5" class="text-center py-4 text-red-500">خطأ في جلب البيانات: ${error.message}</td></tr>`;
        return;
      }

      if (!groups || groups.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="text-center py-4 text-gray-400">لم تقم بإضافة أي مجموعات بعد</td></tr>`;
        return;
      }

      tbody.innerHTML = groups.map(g => {
        const assign = Array.isArray(g.transport_assignments) 
          ? g.transport_assignments[0] 
          : g.transport_assignments;

        const isCompleted = g.status === 'تم تعيين النقل' || g.status === 'تم التعيين';
        const statusBadge = isCompleted 
          ? `<span class="bg-emerald-100 text-emerald-800 px-2.5 py-1 rounded-full font-bold">تم التعيين</span>`
          : `<span class="bg-amber-100 text-amber-800 px-2.5 py-1 rounded-full font-bold">بانتظار النقل</span>`;

        const driverDetails = (assign && assign.driver_name)
          ? `<span class="font-bold text-gray-800">👤 ${assign.driver_name}</span> 
             <span class="text-gray-500">(${assign.bus_number})</span> 
             <span class="text-blue-600 font-mono" dir="ltr">📱 ${assign.driver_phone || ''}</span>`
          : '<span class="text-gray-400">-</span>';

        return `
          <tr class="hover:bg-gray-50 transition">
            <td class="p-3 font-bold text-gray-800">${g.group_number}</td>
            <td class="p-3 font-semibold text-gray-700">${g.num_pilgrims} معتمر</td>
            <td class="p-3 text-gray-600">${g.arrival_date} <span class="text-gray-400">(${g.flight_time})</span></td>
            <td class="p-3">${statusBadge}</td>
            <td class="p-3">${driverDetails}</td>
          </tr>
        `;
      }).join('');
    }

    function showAlert(msg, classes) {
      const box = document.getElementById('alertBox');
      box.className = `p-3 rounded-lg text-xs font-semibold text-center ${classes}`;
      box.textContent = msg;
      box.classList.remove('hidden');
      setTimeout(() => box.classList.add('hidden'), 4000);
    }

    // الأزرار والتفاعلات
    document.getElementById('refreshBtn').addEventListener('click', loadMyGroups);
    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await supabase.auth.signOut();
      window.location.href = 'index.html';
    });

    initPage();
  </script>
</body>
</html>
