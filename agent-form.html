<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام النقل - إدخال وعرض المجموعات</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <style> body { font-family: 'Cairo', sans-serif; } </style>
</head>
<body class="bg-gray-100 min-h-screen p-4 md:p-8">

  <div class="max-w-4xl mx-auto space-y-6">
    <!-- الترويسة وزر الخروج -->
    <div class="flex justify-between items-center bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
      <div>
        <h2 class="text-xl font-bold text-gray-800">🕋 لوحة الوكيل الخارجي</h2>
        <p class="text-xs text-gray-500">إضافة المجموعات ومتابعة حالة النقل الخاصة بك</p>
      </div>
      <button id="logoutBtn" class="bg-red-50 hover:bg-red-100 text-red-600 px-4 py-2 rounded-lg text-sm font-semibold transition">
        تسجيل الخروج
      </button>
    </div>

    <!-- نموذج إضافة مجموعة -->
    <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
      <h3 class="text-base font-bold text-gray-800 mb-4">إضافة مجموعة جديدة</h3>
      <div id="alertBox" class="hidden mb-4 p-3 rounded-lg text-xs text-center font-semibold"></div>

      <form id="agentForm" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1">رقم المجموعة *</label>
          <input type="text" id="group_number" required placeholder="G-101" class="w-full px-3 py-2 text-sm rounded-lg border border-gray-300 focus:ring-2 focus:ring-emerald-500 outline-none">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1">عدد المعتمرين *</label>
          <input type="number" id="num_pilgrims" required placeholder="45" class="w-full px-3 py-2 text-sm rounded-lg border border-gray-300 focus:ring-2 focus:ring-emerald-500 outline-none">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1">تاريخ الوصول *</label>
          <input type="date" id="arrival_date" required class="w-full px-3 py-2 text-sm rounded-lg border border-gray-300 focus:ring-2 focus:ring-emerald-500 outline-none">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1">وقت الرحلة *</label>
          <input type="time" id="flight_time" required class="w-full px-3 py-2 text-sm rounded-lg border border-gray-300 focus:ring-2 focus:ring-emerald-500 outline-none">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1">فندق مكة</label>
          <input type="text" id="makkah_hotel" placeholder="اسم الفندق" class="w-full px-3 py-2 text-sm rounded-lg border border-gray-300 focus:ring-2 focus:ring-emerald-500 outline-none">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1">فندق المدينة</label>
          <input type="text" id="madinah_hotel" placeholder="اسم الفندق" class="w-full px-3 py-2 text-sm rounded-lg border border-gray-300 focus:ring-2 focus:ring-emerald-500 outline-none">
        </div>
        <div class="md:col-span-2">
          <label class="block text-xs font-semibold text-gray-700 mb-1">شركة النقل الموجهة *</label>
          <select id="transport_company_id" required class="w-full px-3 py-2 text-sm rounded-lg border border-gray-300 focus:ring-2 focus:ring-emerald-500 outline-none bg-white">
            <option value="">جاري تحميل شركات النقل...</option>
          </select>
        </div>
        <button type="submit" id="submitBtn" class="md:col-span-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-lg shadow transition">
          حفظ وإرسال الرحلة
        </button>
      </form>
    </div>

    <!-- جدول مجموعات الوكيل -->
    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
      <div class="p-4 border-b border-gray-100">
        <h3 class="font-bold text-gray-800 text-sm">📋 مجموعاتي المسجلة وحالة النقل</h3>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-right text-xs">
          <thead class="bg-gray-50 text-gray-600">
            <tr>
              <th class="p-3">رقم المجموعة</th>
              <th class="p-3">العدد</th>
              <th class="p-3">الوصول</th>
              <th class="p-3">الحالة</th>
              <th class="p-3">بيانات السائق والحافلة</th>
            </tr>
          </thead>
          <tbody id="myGroupsBody" class="divide-y divide-gray-100">
            <tr><td colspan="5" class="text-center py-4 text-gray-400">جاري التحميل...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script type="module">
    import { supabase } from './assets/js/supabase.js';

    const alertBox = document.getElementById('alertBox');
    const companySelect = document.getElementById('transport_company_id');
    let currentUser = null;

    async function init() {
      const { data: { user } } = await supabase.auth.getUser();
      if (!user) { window.location.href = 'index.html'; return; }
      currentUser = user;
      loadCompanies();
      loadMyGroups();
    }

    async function loadCompanies() {
      const { data } = await supabase.from('profiles').select('id, company_name').eq('role', 'transport_company');
      companySelect.innerHTML = '<option value="">-- اختر شركة النقل --</option>';
      data?.forEach(c => {
        companySelect.innerHTML += `<option value="${c.id}">${c.company_name}</option>`;
      });
    }

    async function loadMyGroups() {
      const { data } = await supabase
        .from('groups')
        .select('*, transport_assignments(*)')
        .eq('agent_company_id', currentUser.id)
        .order('created_at', { ascending: false });

      const tbody = document.getElementById('myGroupsBody');
      if (!data || data.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="text-center py-4 text-gray-400">لم تقم بإضافة أي مجموعات بعد</td></tr>`;
        return;
      }

      tbody.innerHTML = data.map(g => {
        const assign = g.transport_assignments?.[0] || g.transport_assignments;
        const statusBadge = g.status === 'تم تعيين النقل' 
          ? `<span class="bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded-full">تم التعيين</span>`
          : `<span class="bg-yellow-100 text-yellow-800 px-2 py-0.5 rounded-full">بانتظار النقل</span>`;

        const driverDetails = assign ? `👤 ${assign.driver_name} | 🚌 ${assign.bus_number} | 📱 ${assign.driver_phone}` : '-';

        return `
          <tr class="hover:bg-gray-50">
            <td class="p-3 font-bold">${g.group_number}</td>
            <td class="p-3">${g.num_pilgrims} معتمر</td>
            <td class="p-3">${g.arrival_date} (${g.flight_time})</td>
            <td class="p-3">${statusBadge}</td>
            <td class="p-3 text-gray-600">${driverDetails}</td>
          </tr>
        `;
      }).join('');
    }

    document.getElementById('agentForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const groupData = {
        group_number: document.getElementById('group_number').value,
        num_pilgrims: document.getElementById('num_pilgrims').value,
        arrival_date: document.getElementById('arrival_date').value,
        flight_time: document.getElementById('flight_time').value,
        makkah_hotel: document.getElementById('makkah_hotel').value,
        madinah_hotel: document.getElementById('madinah_hotel').value,
        transport_company_id: companySelect.value,
        agent_company_id: currentUser.id,
        status: 'بانتظار النقل'
      };

      const { error } = await supabase.from('groups').insert([groupData]);
      if (error) {
        showAlert('خطأ: ' + error.message, 'bg-red-100 text-red-700');
      } else {
        showAlert('تمت إضافة المجموعة بنجاح! 🎉', 'bg-emerald-100 text-emerald-800');
        document.getElementById('agentForm').reset();
        loadMyGroups();
      }
    });

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await supabase.auth.signOut();
      window.location.href = 'index.html';
    });

    function showAlert(msg, classes) {
      alertBox.className = `mb-4 p-3 rounded-lg text-xs text-center font-semibold ${classes}`;
      alertBox.textContent = msg;
      alertBox.classList.remove('hidden');
    }

    init();
  </script>
</body>
</html>
